# Services for local mode (scripts/local.ts): SeaweedFS as the S3-compatible
# service, PostgreSQL for users, and NATS for change events, on the loopback
# address only. local.ts names the project after the checkout and reads the
# ports that Docker picks. Data stays in named volumes between runs;
# `scripts/local.ts down` removes it.

services:
  storage:
    # Supports conditional PUT (If-None-Match / If-Match), which the head
    # CAS depends on.
    image: chrislusf/seaweedfs:4.48
    # weed does not stop on SIGTERM as PID 1.
    init: true
    command:
      - mini
      - -dir=/data
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -bucket=lager
      - -admin.ui=false
      - -webdav=false
    ports:
      - "127.0.0.1::8333"
    volumes:
      - storage-data:/data
      - ${LAGER_LOCAL_DIR:?}/s3.json:/etc/seaweedfs/s3.json:ro

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: lager
      POSTGRES_DB: lager
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lager", "-d", "lager"]
      interval: 1s
      retries: 30

  nats:
    image: nats:2
    ports:
      - "127.0.0.1::4222"

volumes:
  storage-data:
  postgres-data:
