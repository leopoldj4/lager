# A Dokploy "Compose" service builds the image from this repository on the
# server, and Dokploy's Traefik terminates HTTPS. Repositories live in an
# external S3-compatible service.
#
# In Dokploy, set the compose path to ./deploy/dokploy.compose.yaml. The
# configuration is Dokploy's environment for this service; deploy/README.md
# lists the variables.
#
# Traefik's entry points must not time out long pushes: set
# transport.respondingTimeouts.readTimeout to 0s for web and websecure in
# Dokploy's Traefik settings. The routing labels are in dokploy.traefik.yaml.

services:
  lager:
    extends:
      file: dokploy.traefik.yaml
      service: lager
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    # Room for the drain delay (5 s) and shutdown timeout (180 s): running
    # pushes finish.
    stop_grace_period: 3m10s
    # Git over SSH on LAGER_SSH_PORT (default 22); one deployment per server
    # can have 22. The host's own SSH server must use another port.
    ports:
      - "${LAGER_SSH_PORT:-22}:2222"
    # The configuration; `docker compose exec lager lager ...` gets it too.
    environment:
      LAGER_DOMAIN: ${LAGER_DOMAIN:?set LAGER_DOMAIN}
      LAGER_S3_ENDPOINT: ${LAGER_S3_ENDPOINT:-}
      LAGER_S3_REGION: ${LAGER_S3_REGION:-}
      LAGER_S3_BUCKET: ${LAGER_S3_BUCKET:?set LAGER_S3_BUCKET}
      LAGER_S3_ACCESS_KEY_ID: ${LAGER_S3_ACCESS_KEY_ID:?set LAGER_S3_ACCESS_KEY_ID}
      LAGER_S3_SECRET_ACCESS_KEY: ${LAGER_S3_SECRET_ACCESS_KEY:?set LAGER_S3_SECRET_ACCESS_KEY}
      LAGER_S3_PREFIX: ${LAGER_S3_PREFIX:-}
      LAGER_DATABASE_URL: postgres://lager:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/lager
      LAGER_NATS_URL: nats://nats:4222
      LAGER_SESSION_SECRET: ${LAGER_SESSION_SECRET:?set LAGER_SESSION_SECRET}
      LAGER_SIGN_UP: ${LAGER_SIGN_UP:-}
      LAGER_GITHUB_CLIENT_ID: ${LAGER_GITHUB_CLIENT_ID:-}
      LAGER_GITHUB_CLIENT_SECRET: ${LAGER_GITHUB_CLIENT_SECRET:-}
      # Keep it: clients refuse a changed host key.
      LAGER_SSH_HOST_KEY: ${LAGER_SSH_HOST_KEY:?set LAGER_SSH_HOST_KEY}
      LAGER_SSH_PORT: ${LAGER_SSH_PORT:-}
    volumes:
      # Caches only; any of it can be removed. Use local disk.
      - lager-cache:/var/cache/lager
    networks:
      - default
      - dokploy-network
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_healthy

  nats:
    image: nats:2
    restart: unless-stopped
    command: ["--name", "lager"]

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: lager
      POSTGRES_DB: lager
      # Only used when the database is created.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lager", "-d", "lager"]
      interval: 5s
      retries: 10

networks:
  dokploy-network:
    external: true

volumes:
  lager-cache:
  postgres-data:
