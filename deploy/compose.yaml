# One host: Caddy (HTTPS), lager (also Git over SSH on port 22), NATS,
# and PostgreSQL. Repositories live
# in an external S3-compatible service (R2, S3, ...); see lager.example.toml.
#
#   docker build -t lager:$(git rev-parse --short HEAD) ..   # the image name
#   cp .env.example .env && cp lager.example.toml lager.toml   # fill in both
#   ssh-keygen -t ed25519 -N '' -C lager -f ssh_host_ed25519_key \
#     && sudo chown 10001 ssh_host_ed25519_key                     # SSH host key
#   docker compose up -d
#   docker compose exec lager lager user create <name> --access '*=force'

name: lager

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      LAGER_DOMAIN: ${LAGER_DOMAIN:?set LAGER_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - lager

  lager:
    image: ${LAGER_IMAGE:?set LAGER_IMAGE in .env to the image docker load printed}
    restart: unless-stopped
    # Room for the drain delay (5 s) and shutdown timeout (180 s): running
    # pushes finish.
    stop_grace_period: 3m10s
    # Git over SSH. The host's own SSH server must use another port.
    ports:
      - "22:2222"
    environment:
      # For `docker compose exec lager lager ...`.
      LAGER_CONFIG: /etc/lager/lager.toml
    volumes:
      - ./lager.toml:/etc/lager/lager.toml:ro
      # Keep this file: clients refuse a changed host key.
      - ./ssh_host_ed25519_key:/etc/lager/ssh_host_ed25519_key:ro
      # Caches only; any of it can be removed. Use local disk.
      - lager-cache:/var/cache/lager
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_healthy

  nats:
    image: nats:2
    restart: unless-stopped
    command: ["--name", "lager"]

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: lager
      POSTGRES_DB: lager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lager", "-d", "lager"]
      interval: 5s
      retries: 10

volumes:
  caddy-data:
  caddy-config:
  lager-cache:
  postgres-data:
