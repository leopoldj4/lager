name: Deploy production

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Let an active deployment finish, including rollback, before starting another.
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production
      url: https://git.leoj.de
    env:
      DEPLOY_HOST: root@worktree.tailb80a2d.ts.net
      DEPLOY_IMAGE: worktree:${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check deployment credentials
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          test -n "$TS_OAUTH_CLIENT_ID" && test -n "$TS_OAUTH_SECRET" || {
            echo '::error::Configure TS_OAUTH_CLIENT_ID and TS_OAUTH_SECRET; see deploy/README.md.'
            exit 1
          }

      - name: Connect to production network
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:worktree-ci

      - name: Build image on production host
        run: |
          set -o pipefail
          # Avoid BuildKit's stdin/remote-context session failure when loading
          # the external Dockerfile frontend. Build from an extracted directory.
          git archive --format=tar "$GITHUB_SHA" | tailscale ssh "$DEPLOY_HOST" \
            "set -eu
             build_context=\$(mktemp -d /tmp/worktree-build.XXXXXXXXXX)
             trap 'rm -rf -- \"\$build_context\"' EXIT
             tar -xf - -C \"\$build_context\"
             DOCKER_BUILDKIT=1 docker build --platform linux/amd64 --tag '$DEPLOY_IMAGE' \"\$build_context\" < /dev/null"

      - name: Deploy with health check and rollback
        run: tailscale ssh "$DEPLOY_HOST" "bash -s -- '$DEPLOY_IMAGE' /opt/worktree" < deploy/update.sh

      - name: Check public endpoint
        run: curl --fail --show-error --silent --retry 5 --retry-all-errors --retry-delay 5 --max-time 15 https://git.leoj.de/_worktree/health
