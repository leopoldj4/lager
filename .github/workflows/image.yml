# Builds the container image with Nix (this also runs the test suite) and
# pushes it to the Vultr container registry, tagged with the commit.
# Deploy a pushed tag with deploy/vultr/rollout.sh.
#
# Repository settings: variable VULTR_REGISTRY (OpenTofu output
# `registry`), secrets VULTR_REGISTRY_USERNAME and VULTR_REGISTRY_PASSWORD.
name: image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Build
        run: nix build .#docker --print-build-logs
      - name: Push
        env:
          REGISTRY: ${{ vars.VULTR_REGISTRY }}
          USERNAME: ${{ secrets.VULTR_REGISTRY_USERNAME }}
          PASSWORD: ${{ secrets.VULTR_REGISTRY_PASSWORD }}
        run: |
          loaded=$(./result | docker load | sed -n 's/^Loaded image: //p')
          image="$REGISTRY:${GITHUB_SHA::12}"
          docker tag "$loaded" "$image"
          echo "$PASSWORD" | docker login "${REGISTRY%%/*}" -u "$USERNAME" --password-stdin
          docker push "$image"
          echo "Pushed \`$image\`. Deploy: \`deploy/vultr/rollout.sh ${GITHUB_SHA::12}\`" >> "$GITHUB_STEP_SUMMARY"
