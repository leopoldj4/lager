# Builds the management interface (web/) and pushes it to the Vultr
# container registry as <VULTR_REGISTRY>-web, tagged with the commit.
# Deploy a pushed tag with deploy/vultr/rollout.sh --web.
#
# Uses the same repository settings as image.yml.
name: web-image

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/web-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Lint
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run lint
      - name: Build and push
        env:
          REGISTRY: ${{ vars.VULTR_REGISTRY }}
          USERNAME: ${{ secrets.VULTR_REGISTRY_USERNAME }}
          PASSWORD: ${{ secrets.VULTR_REGISTRY_PASSWORD }}
        run: |
          : "${REGISTRY:?repository variable VULTR_REGISTRY is not set}"
          image="$REGISTRY-web:${GITHUB_SHA::12}"
          # The servers are x86_64.
          docker build --platform linux/amd64 -t "$image" web
          echo "$PASSWORD" | docker login "${REGISTRY%%/*}" -u "$USERNAME" --password-stdin
          docker push "$image"
          echo "Pushed \`$image\`. Deploy: \`deploy/vultr/rollout.sh --web ${GITHUB_SHA::12}\`" >> "$GITHUB_STEP_SUMMARY"
