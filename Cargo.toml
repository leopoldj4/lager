[workspace]
resolver = "3"
members = ["crates/core", "crates/server", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "FSL-1.1-ALv2"

# Password hashing is deliberately expensive and prohibitively slow in an
# unoptimized local build. Keep the application debuggable while optimizing
# the crate that performs PBKDF2.
[profile.dev.package.lager-core]
opt-level = 3

# Likewise for the gix crates that decompress and decode objects in the web
# reads (docs/decisions/0021-web-reads-with-gix.md).
[profile.dev.package.gix]
opt-level = 3
[profile.dev.package.gix-actor]
opt-level = 3
[profile.dev.package.gix-commitgraph]
opt-level = 3
[profile.dev.package.gix-date]
opt-level = 3
[profile.dev.package.gix-hash]
opt-level = 3
[profile.dev.package.gix-hashtable]
opt-level = 3
[profile.dev.package.gix-object]
opt-level = 3
[profile.dev.package.gix-odb]
opt-level = 3
[profile.dev.package.gix-pack]
opt-level = 3
[profile.dev.package.gix-ref]
opt-level = 3
[profile.dev.package.gix-revwalk]
opt-level = 3
[profile.dev.package.gix-traverse]
opt-level = 3
[profile.dev.package.gix-zlib]
opt-level = 3
[profile.dev.package.zlib-rs]
opt-level = 3

# Versions are fixed with `=` so that the tested combination is the built one.
[workspace.dependencies]
lager-core = { path = "crates/core" }
anyhow = "=1.0.104"
async-nats = { version = "=0.50.0", default-features = false, features = ["ring"] }
async-compression = { version = "=0.4.48", features = ["tokio", "gzip"] }
async-trait = "=0.1.92"
axum = { version = "=0.8.9", features = ["http1", "tokio", "ws"] }
base64 = "=0.22.1"
bytes = "=1.12.1"
clap = { version = "=4.6.7", features = ["derive", "env"] }
futures = "=0.3.34"
# Web reads of objects and refs (docs/decisions/0021-web-reads-with-gix.md).
gix = { version = "=0.89.0", default-features = false, features = ["max-performance-safe", "sha1"] }
hex = "=0.4.3"
hyper-util = { version = "=0.1.21", features = ["tokio", "server", "server-auto", "service"] }
libc = "=0.2.186"
percent-encoding = "=2.3.2"
object_store = { version = "=0.14.2", features = ["aws"] }
rand = "=0.9.2"
reqwest = { version = "=0.13.3", default-features = false, features = ["rustls", "json", "form", "query"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres"] }
thiserror = "=2.0.21"
tokio = { version = "=1.53.1", features = ["full"] }
tokio-util = { version = "=0.7.19", features = ["io", "compat", "rt"] }
toml = "=1.1.6"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "=1.26.1", features = ["v4", "serde"] }
webauthn-rs = { version = "=0.5.5", default-features = false, features = ["danger-allow-state-serialisation", "conditional-ui"] }
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa", "flate2"] }
