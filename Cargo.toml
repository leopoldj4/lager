[workspace]
resolver = "3"
members = ["crates/core", "crates/server", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "FSL-1.1-ALv2"

# Versions are fixed with `=` so that the tested combination is the built one.
[workspace.dependencies]
worktree-core = { path = "crates/core" }
anyhow = "=1.0.104"
async-nats = { version = "=0.50.0", default-features = false, features = ["ring"] }
async-compression = { version = "=0.4.48", features = ["tokio", "gzip"] }
async-trait = "=0.1.92"
axum = { version = "=0.8.9", features = ["http1", "tokio", "ws"] }
base64 = "=0.22.1"
bytes = "=1.12.1"
clap = { version = "=4.6.7", features = ["derive", "env"] }
futures = "=0.3.34"
hex = "=0.4.3"
hyper-util = { version = "=0.1.21", features = ["tokio", "server", "server-auto", "service"] }
libc = "=0.2.186"
percent-encoding = "=2.3.2"
object_store = { version = "=0.14.2", features = ["aws"] }
rand = "=0.9.2"
reqwest = { version = "=0.13.3", default-features = false, features = ["stream", "rustls"] }
rustls-pemfile = "=2.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres"] }
thiserror = "=2.0.21"
tokio = { version = "=1.53.1", features = ["full"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "=0.7.19", features = ["io", "compat", "rt"] }
toml = "=1.1.6"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "=1.26.1", features = ["v4", "serde"] }
